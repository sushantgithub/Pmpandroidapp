name: Build Debug APK
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicit package list: the action's default ("tools platform-tools")
          # tries to install the obsolete "tools" package, which Google removed
          # from the SDK repo, so setup fails with "Failed to find package 'tools'".
          # Install only valid packages the build actually needs.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew test --no-daemon
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pmp-study-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7